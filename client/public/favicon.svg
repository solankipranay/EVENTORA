<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="garbaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="45%" stop-color="#881337" />
      <stop offset="85%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Festive Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#garbaBg)" />

  <!-- Outer Decorative Ring -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="12 8" />

  <g filter="url(#shadow)">
    <!-- Crossed Dandiya Sticks -->
    <!-- Dandiya 1 (Top Left to Bottom Right) -->
    <g transform="rotate(35 256 256)">
      <rect x="242" y="90" width="28" height="332" rx="14" fill="url(#goldGrad)" />
      <!-- Decorative Rings on Dandiya 1 -->
      <rect x="242" y="130" width="28" height="12" fill="#dc2626" />
      <rect x="242" y="160" width="28" height="12" fill="#2563eb" />
      <rect x="242" y="190" width="28" height="12" fill="#16a34a" />
      <rect x="242" y="310" width="28" height="12" fill="#dc2626" />
      <rect x="242" y="340" width="28" height="12" fill="#2563eb" />
      <!-- Tassel at top -->
      <circle cx="256" cy="94" r="8" fill="#fef08a" />
    </g>

    <!-- Dandiya 2 (Top Right to Bottom Left) -->
    <g transform="rotate(-35 256 256)">
      <rect x="242" y="90" width="28" height="332" rx="14" fill="url(#goldGrad)" />
      <!-- Decorative Rings on Dandiya 2 -->
      <rect x="242" y="130" width="28" height="12" fill="#16a34a" />
      <rect x="242" y="160" width="28" height="12" fill="#dc2626" />
      <rect x="242" y="190" width="28" height="12" fill="#2563eb" />
      <rect x="242" y="310" width="28" height="12" fill="#16a34a" />
      <rect x="242" y="340" width="28" height="12" fill="#dc2626" />
      <!-- Tassel at top -->
      <circle cx="256" cy="94" r="8" fill="#fef08a" />
    </g>

    <!-- Center Garba Matka / Diya Bowl -->
    <path d="M196 330 C196 290 220 270 256 270 C292 270 316 290 316 330 C316 360 290 380 256 380 C222 380 196 360 196 330 Z" fill="url(#goldGrad)" />
    <path d="M210 320 Q256 300 302 320" fill="none" stroke="#991b1b" stroke-width="6" stroke-linecap="round" />

    <!-- Diya Flame (Glowing in Center) -->
    <g filter="url(#glow)">
      <path d="M256 200 C272 230 280 250 280 268 C280 281 269 292 256 292 C243 292 232 281 232 268 C232 250 240 230 256 200 Z" fill="url(#flameGrad)" />
      <!-- Inner Flame Core -->
      <path d="M256 230 C264 248 268 258 268 268 C268 275 263 280 256 280 C249 280 244 275 244 268 C244 258 248 248 256 230 Z" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Celebration Sparkles -->
    <path d="M150 180 Q150 195 165 195 Q150 195 150 210 Q150 195 135 195 Q150 195 150 180 Z" fill="#fef08a" />
    <path d="M362 180 Q362 195 377 195 Q362 195 362 210 Q362 195 347 195 Q362 195 362 180 Z" fill="#fef08a" />
    <circle cx="256" cy="140" r="6" fill="#fef08a" />
    <circle cx="130" cy="300" r="5" fill="#f59e0b" />
    <circle cx="382" cy="300" r="5" fill="#f59e0b" />
  </g>
</svg>
